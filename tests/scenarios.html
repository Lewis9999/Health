async function fresh() {
  await new Promise(r => { f.onload = r; if (!f.src) f.src = q.get('app'); else { w.localStorage.clear(); w.location.hash = ''; w.location.reload(); } });
  await sleep(300);
  if (!fresh.cleared) { fresh.cleared = true; w = f.contentWindow; w.localStorage.clear(); await new Promise(r => { f.onload = r; w.location.reload(); }); await sleep(300); }
  w = f.contentWindow; d = w.document; toasts = [];
  w.addEventListener('error', e => res.errors.push(scen + ': ' + e.message));
  const ce = w.console.error; w.console.error = (...a) => { res.errors.push(scen + ' console: ' + a.join(' ')); ce.apply(w.console, a); };
  new w.MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => n.nodeType === 1 && toasts.push(n.innerText.trim() || n.textContent.trim())))).observe(d.querySelector('#toasts'), { childList: true });
}

function audit(name) {
  const cv = d.createElement('canvas'); cv.width = cv.height = 1; const cx = cv.getContext('2d', { willReadFrequently: true });
  const rgba = c => { cx.clearRect(0, 0, 1, 1); cx.fillStyle = c; cx.fillRect(0, 0, 1, 1); const p = cx.getImageData(0, 0, 1, 1).data; return [p[0], p[1], p[2], p[3] / 255]; };
  const mix = (a, b) => [0, 1, 2].map(i => a[i] * a[3] + b[i] * (1 - a[3])).concat(1);
  const lum = c => { const v = [0, 1, 2].map(i => { const s = c[i] / 255; return s <= .03928 ? s / 12.92 : Math.pow((s + .055) / 1.055, 2.4); }); return .2126 * v[0] + .7152 * v[1] + .0722 * v[2]; };
  const bgOf = el => { const st = []; for (let e = el; e; e = e.parentElement) { const c = rgba(w.getComputedStyle(e).backgroundColor); if (c[3] > 0) { st.push(c); if (c[3] >= 1) break; } } return st.reverse().reduce((a, c) => mix(c, a), [255, 255, 255, 1]); };
  const roots = modalOpen() ? [d.querySelector('#modal .modal-content'), d.querySelector('#toasts')] : drawerOpen() ? [d.querySelector('#demoDrawer')] : [d.querySelector('#view'), d.querySelector('#toasts')];
  const side = d.querySelector('#demoDrawer .offcanvas-body');
  if (drawerOpen() && side.scrollWidth - side.clientWidth > 1) res.overflow[name + '(drawer)'] = side.scrollWidth - side.clientWidth;
  for (const root of roots) for (const el of root.querySelectorAll('*')) {
    if (![...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim())) continue;
    if (el.closest('option,select,svg,.visually-hidden,:disabled,.disabled')) continue;
    const r = el.getBoundingClientRect(), s = w.getComputedStyle(el);
    if (!r.width || !r.height || s.visibility === 'hidden') continue;
    const bg = bgOf(el), fg = mix(rgba(s.color), bg), a = lum(fg), b = lum(bg), ratio = (Math.max(a, b) + .05) / (Math.min(a, b) + .05);
    const size = parseFloat(s.fontSize), large = size >= 24 || (size >= 18.66 && +s.fontWeight >= 700);
    if (ratio < (large ? 3 : 4.5)) res.contrast[`${el.tagName.toLowerCase()}.${el.className} fg=${fg.slice(0, 3).map(Math.round)} bg=${bg.slice(0, 3).map(Math.round)}`] ??= { ratio: +ratio.toFixed(2), at: name, text: el.textContent.trim().slice(0, 24) };
  }
  const over = d.documentElement.scrollWidth - d.documentElement.clientWidth;
  if (over > 1) res.overflow[name] = over;
  const body = d.querySelector('#modal .modal-body');
  if (modalOpen() && body.scrollWidth - body.clientWidth > 1) res.overflow[name + '(modal)'] = body.scrollWidth - body.clientWidth;
}

  async '14 匯出 CSV'() {
    const files = [];
    const blobs = new Map();
    w.URL.createObjectURL = b => { const u = 'blob:test-' + blobs.size; blobs.set(u, b); return u; };
    w.URL.revokeObjectURL = () => {};
    const realClick = w.HTMLAnchorElement.prototype.click;
    w.HTMLAnchorElement.prototype.click = function () { if (this.download) files.push({ name: this.download, blob: blobs.get(this.getAttribute('href')) }); else realClick.call(this); };
    const read = async file => { const bytes = new Uint8Array(await file.blob.arrayBuffer()); const text = new TextDecoder().decode(bytes); return { bom: bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF, lines: text.split('\r\n') }; };
    async function exportBy(act) {
      const before = files.length, logs = run('DB.exportLog.length');
      await click(`#view [data-act=${act}]`);
      if (files.length !== before + 1) { ok(`${act} 產生下載檔`, false, lastToasts()); return null; }
      ok(`${act} 產生下載檔並寫入匯出紀錄`, run('DB.exportLog.length') === logs + 1 && lastToasts().includes('匯出紀錄'), lastToasts());
      return { name: files.at(-1).name, ...await read(files.at(-1)) };
    }
    await as('u_sub1'); await go('history');
    let c = await exportBy('exportPersonal');
    if (c) {
      ok('個人報表：檔名、UTF-8 BOM、筆數正確', c.name === '個人報表_S01.csv' && c.bom && c.lines.length === run("recordsOf('S01').length") + 1, `${c.name} bom=${c.bom} lines=${c.lines.length}`);
      ok('個人報表：每列都有非醫療診斷聲明', c.lines.slice(1).every(l => l.includes('非醫療診斷')), c.lines[1]);
      ok('個人報表：不含「實驗中」指標', !c.lines[0].includes('呼吸頻率'), c.lines[0]);
    }
    await as('u_mgr'); await go('group');
    c = await exportBy('exportGroup');
    if (c) ok('群體彙總：只有三個分類，不含姓名', c.lines.length === 4 && !run('DB.subjects.map(s=>s.name)').some(n => c.lines.join().includes(n)), c.lines.join(' / '));
    await set('[data-key=gdept]', 'adm');
    ok('人數過少時沒有匯出按鈕', !d.querySelector('#view [data-act=exportGroup]'), view());
    await as('u_admin'); await go('reference');
    d.querySelector('#view [name=ref]').value = '999'; d.querySelector('#view [name=device]').value = '=1+1';
    await click(btn('新增'), '新增配對');
    c = await exportBy('exportRef');
    if (c) {
      const row = c.lines.find(l => l.includes('999')) || '';
      ok('參考值配對：公式開頭的文字加上單引號', row.includes('"\'=1+1"'), row);
      ok('參考值配對：負數差值仍是數字', /"-\d+\.\d{2}"/.test(row), row);
    }
    await go('audit');
    ok('稽核頁看得到匯出紀錄', view().includes('個人報表_S01') && view().includes('群體彙總') && view().includes('參考值配對'), view().slice(0, 400));
  },
