    <circle cx="340" cy="84" r="28" fill="#fffdf6"/>
    <path d="M327 84 L337 94 L354 74" fill="none" stroke="#4f7f55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

