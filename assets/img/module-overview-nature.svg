  <!-- 中央：嫩芽與心率 -->
  <circle cx="808" cy="462" r="130" fill="#53704a" opacity=".16"/>
  <circle cx="800" cy="450" r="130" fill="#23402f"/>
  <circle cx="800" cy="450" r="108" fill="none" stroke="#a9c694" stroke-width="3"/>
  <use href="#leaf" fill="#a9c694" transform="translate(798 428) rotate(-22) scale(.78)"/>
  <use href="#leaf" fill="#8db374" transform="translate(802 428) scale(-.68 .68) rotate(-22)"/>
  <path d="M800 428 V462" stroke="#a9c694" stroke-width="8" stroke-linecap="round"/>
  <path d="M728 488 H770 L785 462 L805 520 L820 488 H872" fill="none" stroke="#fffdf6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 飄落的葉片 -->
  <g fill="#8db374">
    <use href="#leaf" transform="translate(742 140) rotate(8) scale(.62)"/>
    <use href="#leaf" transform="translate(858 760) rotate(165) scale(.5)"/>
    <use href="#leaf" transform="translate(580 120) rotate(-40) scale(.34)"/>
    <use href="#leaf" transform="translate(1012 770) rotate(-30) scale(.38)"/>
    <use href="#leaf" transform="translate(160 458) rotate(14) scale(.58)"/>
    <use href="#leaf" transform="translate(1448 462) scale(-.58 .58) rotate(14)"/>
  </g>
  <g fill="#c9a45f">
    <circle cx="1018" cy="132" r="9"/><circle cx="560" cy="780" r="7"/><circle cx="300" cy="450" r="7"/><circle cx="1300" cy="445" r="9"/>
  </g>
</svg>
