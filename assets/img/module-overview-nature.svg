<svg xmlns="http://www.w3.org/2000/svg" viewBox="-800 0 3200 900" width="3200" height="900" role="img" aria-label="模組總覽：健康管理、健康商品、知識助理、系統設定">
  <defs>
    <path id="leaf" d="M0 0 C18 -52 72 -64 112 -50 C104 -6 62 22 0 0 Z"/>
  </defs>

  <!-- 背景：天空、暖陽、山丘 -->
