    <path d="M72 108 H208 L222 240 H58 Z" fill="#b98f62"/>
    <use href="#leaf" fill="#fffdf6" transform="translate(104 204) rotate(-18) scale(.72)"/>
    <path d="M112 200 L164 166" stroke="#b98f62" stroke-width="5" stroke-linecap="round"/>
    <rect x="258" y="130" width="60" height="110" rx="14" fill="#4f7f55"/>
    <rect x="270" y="108" width="36" height="24" rx="6" fill="#8a6a45"/>
    <rect x="268" y="165" width="40" height="38" rx="6" fill="#fffdf6"/>
    <path d="M288 173 V195 M277 184 H299" stroke="#4f7f55" stroke-width="7" stroke-linecap="round"/>
    <rect x="326" y="180" width="42" height="60" rx="11" fill="#d9a05b"/>
