    <path d="M54 112 H122 L141 76 L166 150 L190 92 L204 112 H250" fill="none" stroke="#17594a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M315 143 C245 100 266 56 296 62 C306 64 312 71 315 79 C318 71 324 64 334 62 C364 56 385 100 315 143 Z" fill="#c9785d"/>
    <path d="M287 98 H303 L311 84 L320 112 L328 98 H343" fill="none" stroke="#fffdf6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#a9c694">
