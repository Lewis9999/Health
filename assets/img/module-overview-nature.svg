  <g transform="translate(1070 500)">
    <rect x="34" y="34" width="352" height="238" rx="20" fill="#eeeadf"/>
    <g transform="translate(130 128)">
      <g fill="#6a5742">
        <rect x="-15" y="-74" width="30" height="148" rx="9"/>
        <rect x="-15" y="-74" width="30" height="148" rx="9" transform="rotate(45)"/>
        <rect x="-15" y="-74" width="30" height="148" rx="9" transform="rotate(90)"/>
        <rect x="-15" y="-74" width="30" height="148" rx="9" transform="rotate(135)"/>
        <circle r="55"/>
      </g>
      <circle r="23" fill="#eeeadf"/>
