    <path d="M236 80 H356 M236 130 H356 M236 180 H356" stroke="#d5ceba" stroke-width="10" stroke-linecap="round"/>
    <path d="M236 80 H316 M236 130 H268 M236 180 H334" stroke="#4f7f55" stroke-width="10" stroke-linecap="round"/>
    <g fill="#fffdf6" stroke="#4f7f55" stroke-width="5"><circle cx="316" cy="80" r="14"/><circle cx="268" cy="130" r="14"/><circle cx="334" cy="180" r="14"/></g>
    <rect x="58" y="222" width="304" height="30" rx="15" fill="#fffdf6"/>
    <circle cx="76" cy="237" r="7" fill="#8db374"/>
    <path d="M96 237 H226 M246 237 H292" stroke="#bdb39a" stroke-width="8" stroke-linecap="round"/>
