  <rect x="-800" width="3200" height="900" fill="#e8eedc"/>
  <circle cx="800" cy="450" r="350" fill="#f6f1dc" opacity=".75"/>
  <circle cx="800" cy="450" r="265" fill="#fbf6e4"/>
  <path d="M-800 720 C-560 650 -220 835 0 760 C220 650 420 700 620 765 C850 840 1080 640 1330 700 C1440 726 1530 720 1600 690 C1820 630 2100 800 2400 710 V900 H-800 Z" fill="#cbdcb6"/>
  <path d="M-800 815 C-520 890 -240 905 0 835 C260 760 520 880 820 835 C1120 790 1360 862 1600 800 C1840 740 2120 870 2400 815 V900 H-800 Z" fill="#adc796"/>
  <circle cx="800" cy="450" r="305" fill="none" stroke="#8fae7c" stroke-width="3" stroke-dasharray="3 14" stroke-linecap="round"/>

  <!-- 連接的枝條 -->
  <g fill="none" stroke="#6f9360" stroke-width="7" stroke-linecap="round">
