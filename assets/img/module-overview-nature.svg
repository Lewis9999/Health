  <g transform="translate(110 500)">
    <rect x="34" y="34" width="352" height="238" rx="20" fill="#e4eef0"/>
    <path d="M74 62 H214 Q232 62 232 80 V122 Q232 140 214 140 H108 L78 164 L84 140 H74 Q56 140 56 122 V80 Q56 62 74 62 Z" fill="#31607a"/>
    <g fill="#fffdf6"><circle cx="106" cy="101" r="10"/><circle cx="144" cy="101" r="10"/><circle cx="182" cy="101" r="10"/></g>
    <rect x="248" y="74" width="106" height="138" rx="14" fill="#fffdf6"/>
    <path d="M268 104 H334 M268 128 H334 M268 152 H312" stroke="#8fb1bd" stroke-width="9" stroke-linecap="round"/>
    <rect x="266" y="172" width="42" height="20" rx="10" fill="#8db374"/>
    <path d="M100 182 H220 Q236 182 236 198 V228 Q236 244 220 244 H208 L214 262 L188 244 H100 Q84 244 84 228 V198 Q84 182 100 182 Z" fill="#c4d9d3"/>
    <path d="M108 204 H210 M108 224 H176" stroke="#31607a" stroke-width="9" stroke-linecap="round"/>
